name: 나경이 근무 위젯 앱 만들기

# widget-app.zip 을 올리거나 이 파일을 고치면 자동으로 앱(APK)을 만들어 Releases 에 올린다.
on:
  push:
    paths:
      - 'widget-app.zip'
      - '.github/workflows/build-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: widget-app.zip 압축 풀기
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q widget-app.zip -d build-src
          ls build-src/widget-app

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 앱 만들기
        working-directory: build-src/widget-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 앱 파일 이름 정리
        run: cp build-src/widget-app/app/build/outputs/apk/release/app-release.apk nagyeong-widget.apk

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-${{ github.run_number }}
          name: 나경이 근무 위젯 (${{ github.run_number }}번째)
          body: 휴대폰에서 아래 nagyeong-widget.apk 를 눌러 내려받은 뒤 설치하세요.
          files: nagyeong-widget.apk
          make_latest: true
