name: 나경이 일기 안드로이드 앱 만들기

# android-app.zip 을 올리거나 이 파일을 고치면 자동으로 앱(APK)을 만들어 Releases 에 올린다.
on:
  push:
    paths:
      - 'android-app.zip'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: android-app.zip 압축 풀기
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q android-app.zip -d build-src
          ls build-src/android-app

      - name: 앱이 열 주소 정하기 (이 저장소의 깃허브 페이지 주소)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "APP_URL=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_ENV"
          echo "앱이 여는 주소: https://${OWNER}.github.io/${REPO}/"

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 앱 만들기
        working-directory: build-src/android-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 앱 파일 이름 정리
        run: cp build-src/android-app/app/build/outputs/apk/release/app-release.apk nagyeong-diary.apk

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: 나경이 일기 앱 (${{ github.run_number }}번째)
          body: 휴대폰에서 아래 nagyeong-diary.apk 를 눌러 내려받은 뒤 설치하세요.
          files: nagyeong-diary.apk
          make_latest: true
