function renderCalendar() {
  const el = $('#v-calendar');
  const y = S.calY, m = S.calM;
  const first = C.toStr(y, m, 1);
  const startW = C.weekday(first);
  const dim = C.daysInMonth(y, m);
  const gridStart = C.addDays(first, -startW);
  const weeks = Math.ceil((startW + dim) / 7);
  const gridEnd = C.addDays(gridStart, weeks * 7 - 1);
  const evMap = groupBy(C.eventsBetween(gridStart, gridEnd, eventCtx()), 'date');
  const enMap = groupBy(S.entries.filter(e => e.date >= gridStart && e.date <= gridEnd), 'date');
  const t = C.today();
  const shiftOn = S.settings.shiftOn !== false;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = C.addDays(gridStart, i);
    const dd = C.parse(d);
    const evs = evMap.get(d) || [];
    const ens = enMap.get(d) || [];
    const cls = ['cal-cell'];
    if (dd.m !== m) cls.push('out');
    if (i % 7 === 0) cls.push('sun');
    if (i % 7 === 6) cls.push('sat');
    if (d === t) cls.push('today');
    if (d === S.selDate) cls.push('sel');
    const withPhoto = ens.find(e => e.photoIds.length);
    const mark = withPhoto ? `<img class="cal-thumb" data-pid="${esc(withPhoto.photoIds[0])}" alt="">` : ens.length ? '<span class="cal-dot"></span>' : '';
    const evHTML = evs.slice(0, 2).map(e => `<span class="cal-ev k-${e.kind}">${esc(e.short)}</span>`).join('')
      + (evs.length > 2 ? `<span class="cal-more">+${evs.length - 2}</span>` : '');
    const sc = shiftOn ? S.shifts[d] : '';
    const scT = sc ? shiftType(sc) : null;
    const shiftHTML = sc ? `<span class="cal-shift sc-${scT ? scT.color : 'gray'}"><b>${esc(sc)}</b><i> ${esc(scT ? scT.name : '')}</i></span>` : '';
    const label = `${dd.m}월 ${dd.d}일${sc ? `, 근무 ${scT ? scT.name : sc}` : ''}${evs.length ? ', ' + evs.map(e => e.title).join(', ') : ''}${ens.length ? `, 기록 ${ens.length}개` : ''}`;
    cells += `<button class="${cls.join(' ')}" data-act="pick-date" data-date="${d}" aria-label="${esc(label)}">
      <span class="cal-num">${dd.d}</span>${mark}${shiftHTML}${evHTML}</button>`;
  }
  el.innerHTML = `<div class="cal-layout">
    <section class="card cal-card">
      <div class="cal-head">
        <button class="icon-btn" data-act="cal-move" data-d="-1" aria-label="이전 달">${ic('left')}</button>
        <button class="cal-title" data-act="month-picker">${y}년 ${m}월 <small>▾</small></button>
        <button class="icon-btn" data-act="cal-move" data-d="1" aria-label="다음 달">${ic('right')}</button>
        <span class="sp"></span>
        <button class="btn small" data-act="cal-today">오늘</button>
      </div>
      <div class="cal-week">${C.WEEK.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      ${shiftOn ? `<button class="cal-foot" data-act="shift-edit" data-date="${S.selDate && S.selDate.startsWith(first.slice(0, 8)) ? S.selDate : first}">
        <span class="cf-l">💼 ${esc(herName())} 근무표</span>
        <span class="cf-stats">${shiftStatsHTML(S.shifts, y, m) || '<span class="muted">이 달 근무를 넣어 주세요</span>'}</span>
        ${ic('right')}</button>` : ''}
    </section>
    <section class="card day-panel" id="day-panel" aria-live="polite"></section></div>`;
  renderDayPanel();
  hydrate(el);
}
function renderDayPanel() {
  const p = $('#day-panel');
  if (!p) return;
  const d = S.selDate;
  const evs = C.eventsBetween(d, d, eventCtx());
  const ens = S.entries.filter(e => e.date === d);
  const tg = togetherText(d);
  p.innerHTML = `<div class="day-head"><div><h3>${fmtMD(d)} ${C.WEEK[C.weekday(d)]}요일</h3>${tg ? `<p class="muted">${esc(tg)}</p>` : ''}</div>
      <button class="btn small primary" data-act="new-entry" data-date="${d}">${ic('plus')}기록</button></div>
    ${shiftRowHTML(d)}
    ${evs.length ? `<div class="ev-chips">${evs.map(evChip).join('')}</div>` : ''}
    ${ens.length ? `<div class="rec-list">${ens.map(e => entryCard(e, true)).join('')}</div>`
      : `<div class="day-empty"><p>이 날의 기록이 아직 없어요</p><button class="btn soft" data-act="new-entry" data-date="${d}">이 날 기록하기</button></div>`}`;
  hydrate(p);
}
function evChip(e) {
  const act = e.kind === 'custom' ? ` data-act="edit-event" data-id="${esc(e.id)}" role="button" tabindex="0"` : '';
  return `<div class="ev-chip k-${e.kind}"${act}><span>${e.emoji}</span><b>${esc(e.title)}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}</div>`;
}
function selectDate(d, scroll = true) {
  S.selDate = d;
  const { y, m } = C.parse(d);
  if (y !== S.calY || m !== S.calM) {
    S.calY = y; S.calM = m;
    renderCalendar();
  } else {
    $$('#v-calendar .cal-cell').forEach(c => c.classList.toggle('sel', c.dataset.date === d));
    renderDayPanel();
  }
  if (scroll && window.innerWidth < 900) {
    const p = $('#day-panel');
    if (p) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}
function moveMonth(delta) {
  let y = S.calY, m = S.calM + delta;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  S.calY = y; S.calM = m;
  const t = C.today();
  const tt = C.parse(t);
  S.selDate = tt.y === y && tt.m === m ? t : C.toStr(y, m, 1);
  renderCalendar();
}
function openMonthPicker() {
  let y = S.calY;
  const sh = openSheet({ title: '날짜로 이동' });
  const draw = () => {
    sh.body.innerHTML = `<div class="yp"><button class="icon-btn" data-y="-1" aria-label="이전 해">${ic('left')}</button><b>${y}년</b>
      <button class="icon-btn" data-y="1" aria-label="다음 해">${ic('right')}</button></div>
      <div class="mp">${Array.from({ length: 12 }, (_, i) => `<button class="mp-btn${y === S.calY && i + 1 === S.calM ? ' on' : ''}" data-m="${i + 1}">${i + 1}월</button>`).join('')}</div>
      ${C.isValid(S.settings.startDate) ? `<button class="btn soft block" data-start>💞 사귄 날로 가기 (${fmtDot(S.settings.startDate)})</button>` : ''}`;
  };
  draw();
  sh.body.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.y) { y += Number(b.dataset.y); draw(); return; }
    let target = null;
    if (b.dataset.m) {
      const t = C.today();
      const tt = C.parse(t);
      const m = Number(b.dataset.m);
      target = tt.y === y && tt.m === m ? t : C.toStr(y, m, 1);
    } else if ('start' in b.dataset) target = S.settings.startDate;
    if (!target) return;
    await sh.close();
    const p = C.parse(target);
    S.calY = p.y; S.calM = p.m; S.selDate = target;
    renderCalendar();
  });
}

function renderRecords() {
  const el = $('#v-records');
  if (!el.dataset.built) {
    el.innerHTML = `<div class="rec-tools">
      <label class="search">${ic('search')}<input type="search" id="rec-q" placeholder="내용·제목·장소 검색" aria-label="기록 검색" autocomplete="off"></label>
      <div class="seg" role="tablist" aria-label="보기 방식">
        <button type="button" data-act="rec-mode" data-mode="list">${ic('list')}목록</button>
        <button type="button" data-act="rec-mode" data-mode="photo">${ic('grid')}사진</button></div></div>
      <div id="rec-body"></div>`;
    el.dataset.built = '1';
    let timer;
    $('#rec-q').addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => { S.recQuery = e.target.value; S.recLimit = 40; S.photoLimit = 120; renderRecBody(); }, 180);
    });
  }
  $$('[data-act="rec-mode"]', el).forEach(b => b.classList.toggle('on', b.dataset.mode === S.recMode));

function filteredEntries() {
  const q = S.recQuery.trim().toLowerCase();
  if (!q) return S.entries;
  return S.entries.filter(e => `${e.title}\n${e.text}\n${e.place}`.toLowerCase().includes(q));
}
function renderRecBody() {
  const body = $('#rec-body');
  if (!body) return;
  if (!S.entries.length) {
    body.innerHTML = `<div class="big-empty"><div class="em">📖</div><h3>첫 기록을 남겨 보세요</h3>
      <p>함께한 하루, 나눈 이야기, 사진을 차곡차곡 모아 둘 수 있어요.</p>
      <button class="btn primary big" data-act="new-entry">${ic('plus')} 기록하기</button></div>`;
    return;
  }
  const list = filteredEntries();
  if (!list.length) {
    body.innerHTML = `<div class="big-empty"><div class="em">🔍</div><h3>검색 결과가 없어요</h3><p>"${esc(S.recQuery)}"이(가) 들어간 기록이 없어요.</p></div>`;
    return;
  }
  if (S.recMode === 'photo') {
    S.photoItems = list.flatMap(e => e.photoIds.map(pid => ({ pid, entryId: e.id })));
    if (!S.photoItems.length) {
      body.innerHTML = '<div class="big-empty"><div class="em">🖼️</div><h3>아직 사진이 없어요</h3><p>기록을 쓸 때 사진을 함께 넣어 보세요.</p></div>';
      return;
    }
    const shown = S.photoItems.slice(0, S.photoLimit);
    body.innerHTML = `<p class="stats">사진 ${S.photoItems.length.toLocaleString('ko-KR')}장</p>
      <div class="ph-grid">${shown.map((p, i) => `<button data-act="open-viewer" data-idx="${i}" aria-label="사진 ${i + 1}"><img data-pid="${esc(p.pid)}" alt=""></button>`).join('')}</div>
      ${S.photoItems.length > shown.length ? '<div class="more-wrap"><button class="btn" data-act="photo-more">사진 더 보기</button></div>' : ''}`;
  } else {
    const shown = list.slice(0, S.recLimit);
    const groups = new Map();
    for (const e of shown) {
      const key = e.date.slice(0, 7);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    let html = S.recQuery ? `<p class="stats">"${esc(S.recQuery)}" 검색 결과 ${list.length}개</p>` : '';
    for (const [key, items] of groups) {
      const [y, m] = key.split('-').map(Number);
      const total = list.filter(e => e.date.startsWith(key)).length;
      html += `<section class="month-group"><h3>${y}년 ${m}월<small>${total}개</small></h3>
        <div class="rec-list two">${items.map(e => entryCard(e)).join('')}</div></section>`;
    }
    if (list.length > shown.length) html += '<div class="more-wrap"><button class="btn" data-act="rec-more">기록 더 보기</button></div>';
    body.innerHTML = html;
  }
  hydrate(body);
}

  </form>`;
  const sh = openSheet({
    title: orig ? '기록 고치기' : '새 기록', body, wide: true,
    footer: `<button type="button" class="btn ghost" data-x>취소</button><button type="button" class="btn primary ee-save">저장</button>`,
    guard: async () => {
      if (busy) { toast('사진을 정리하는 중이에요. 잠시만 기다려 주세요'); return false; }
      return !dirty || confirmBox({ title: '저장하지 않고 닫을까요?', message: '쓰던 내용과 새로 넣은 사진이 사라져요.', ok: '닫기', danger: true });
    },
    onClose: () => { if (!saved) pending.forEach(p => URL.revokeObjectURL(p.url)); },
  });
  const root = sh.el;
  const form = $('form', root);
  const status = $('.ee-status', root);
  const fileIn = $('.ee-file', root);
  const saveBtn = $('.ee-save', root);

  function drawPhotos() {
    const keep = e.photoIds.filter(pid => !removed.has(pid));
    $('.ee-photos', root).innerHTML =
      keep.map(pid => `<div class="ee-ph"><img data-pid="${esc(pid)}" alt=""><button type="button" class="rm" data-rm="${esc(pid)}" aria-label="사진 빼기">${ic('x')}</button></div>`).join('')
      + pending.map(p => `<div class="ee-ph"><img src="${p.url}" alt=""><button type="button" class="rm" data-rmp="${esc(p.id)}" aria-label="사진 빼기">${ic('x')}</button></div>`).join('')
      + `<button type="button" class="ee-add">${ic('image')}<span>사진 추가</span></button>`;
    hydrate(root);
  }
  drawPhotos();

  form.addEventListener('input', () => { dirty = true; });
  form.addEventListener('submit', ev => ev.preventDefault());
  $('.ee-moods', root).addEventListener('click', ev => {
    const b = ev.target.closest('.mood');
    if (!b) return;
    e.mood = e.mood === b.dataset.v ? '' : b.dataset.v;
    $$('.ee-moods .mood', root).forEach(x => x.classList.toggle('on', x.dataset.v === e.mood));
    dirty = true;
  });
  $('.ee-photos', root).addEventListener('click', ev => {
    if (ev.target.closest('.ee-add')) { if (!busy) fileIn.click(); return; }
    const rm = ev.target.closest('[data-rm]');
    if (rm) { removed.add(rm.dataset.rm); dirty = true; drawPhotos(); return; }
    const rmp = ev.target.closest('[data-rmp]');
    if (rmp) {
      const i = pending.findIndex(p => p.id === rmp.dataset.rmp);
      if (i >= 0) { URL.revokeObjectURL(pending[i].url); pending.splice(i, 1); }
      drawPhotos();
    }
  });
  fileIn.addEventListener('change', async () => {
    const files = Array.from(fileIn.files || []);
    fileIn.value = '';
    if (!files.length) return;
    busy = true; saveBtn.disabled = true;
    let fail = 0;
    for (let i = 0; i < files.length; i++) {
      status.textContent = `사진 정리 중… (${i + 1}/${files.length})`;
      try {
        const r = await processImage(files[i]);
        pending.push({ id: uid(), ...r, url: URL.createObjectURL(r.thumb) });
        dirty = true;
        drawPhotos();
      } catch (err) { console.warn(err); fail++; }
    }
    busy = false; saveBtn.disabled = false;
    status.textContent = fail ? `사진 ${fail}장은 열 수 없어서 빠졌어요 (HEIC 같은 형식은 JPG로 바꿔서 넣어 주세요)` : '';
  });

  saveBtn.addEventListener('click', async () => {
    if (busy || saveBtn.disabled) return;
    const date = $('.ee-date', root).value;
    if (!C.isValid(date)) { toast('날짜를 선택해 주세요'); $('.ee-date', root).focus(); return; }
    e.date = date;
    e.title = $('.ee-title', root).value.trim();
    e.place = $('.ee-place', root).value.trim();
    e.text = $('.ee-text', root).value.replace(/\s+$/, '');
    const keep = e.photoIds.filter(pid => !removed.has(pid));
    if (!e.text.trim() && !e.title && !keep.length && !pending.length) {
      toast('내용이나 사진을 하나 이상 넣어 주세요');
      return;
    }
    saveBtn.disabled = true;
    try {
      const now = Date.now();
      e.photoIds = [...keep, ...pending.map(p => p.id)];
      e.updatedAt = now;
      const tx = db.transaction(['entries', 'photos'], 'readwrite');
      const ps = tx.objectStore('photos');
      for (const p of pending) ps.put({ id: p.id, entryId: e.id, blob: p.blob, thumb: p.thumb, width: p.width, height: p.height, createdAt: now });
      for (const pid of removed) ps.delete(pid);
      tx.objectStore('entries').put(e);
      await txDone(tx);
      saved = true;
      for (const p of pending) thumbCache.set(p.id, p.url);
      removed.forEach(forgetPhoto);
      const i = S.entries.findIndex(x => x.id === e.id);
      if (i >= 0) S.entries[i] = normEntry(e); else S.entries.push(normEntry(e));
      sortEntries();
      requestPersist();
      dirty = false;
      await sh.close();
      if (S.view === 'calendar') { S.selDate = e.date; const p = C.parse(e.date); S.calY = p.y; S.calM = p.m; }
      refreshAll();
      toast(orig ? '고쳤어요' : '저장했어요 💗');
    } catch (err) {
      saveError(err);
    } finally { saveBtn.disabled = false; }
  });
  if (!orig) setTimeout(() => { if (window.innerWidth >= 900) $('.ee-text', root).focus(); }, 300);
}

function openEntryView(id) {
  if (!S.entries.find(x => x.id === id)) return;
  const sh = openSheet({
    title: '기록', wide: true,
    footer: `<button type="button" class="btn ghost danger-text ev-del">${ic('trash')}삭제</button><button type="button" class="btn primary ev-edit">${ic('edit')}고치기</button>`,
    onClose: () => S.live.delete(draw),
  });
  function draw() {

    sh.body.innerHTML = `<p class="ev-meta">${fmtLong(e.date)}${tg ? ` · ${esc(tg)}` : ''}</p>
      ${evs.length ? `<div class="ev-chips ev-day-chips">${evs.map(evChip).join('')}</div>` : ''}
      ${e.title || e.mood ? `<h3 class="ev-title">${e.mood ? e.mood + ' ' : ''}${esc(e.title)}</h3>` : ''}
      ${e.place ? `<div class="ev-place">${ic('pin')}${esc(e.place)}</div>` : ''}
      ${e.text ? `<div class="ev-text">${esc(e.text)}</div>` : ''}
      ${n ? `<div class="ev-photos${n === 1 ? ' one' : n === 2 ? ' two' : ''}">${e.photoIds.map((pid, i) =>
        `<button type="button" data-idx="${i}" aria-label="사진 ${i + 1} 크게 보기"><img data-pid="${esc(pid)}" ${n === 1 ? 'data-full="1"' : ''} alt=""></button>`).join('')}</div>` : ''}`;

  }
  draw();
  S.live.add(draw);
  sh.body.addEventListener('click', ev => {
    const b = ev.target.closest('[data-idx]');
    if (!b) return;
    const e = S.entries.find(x => x.id === id);
    if (e) openViewer(e.photoIds.map(pid => ({ pid, entryId: e.id })), Number(b.dataset.idx));
  });
  $('.ev-edit', sh.el).addEventListener('click', () => openEntryEditor({ id }));
  $('.ev-del', sh.el).addEventListener('click', async () => {
    const e = S.entries.find(x => x.id === id);
    if (!e) return;
    const ok = await confirmBox({
      title: '이 기록을 삭제할까요?',
      message: `${fmtLong(e.date)} 기록${e.photoIds.length ? `과 사진 ${e.photoIds.length}장` : ''}이 지워지고 되돌릴 수 없어요.`,
      ok: '삭제', danger: true,
    });
    if (!ok) return;
    try {
      await deleteEntry(id);
      await sh.close();
      refreshAll();
      toast('삭제했어요');
    } catch (err) { saveError(err); }
  });
}
async function deleteEntry(id) {
  const e = S.entries.find(x => x.id === id);
  if (!e) return;
  const tx = db.transaction(['entries', 'photos'], 'readwrite');
  tx.objectStore('entries').delete(id);
  e.photoIds.forEach(pid => tx.objectStore('photos').delete(pid));
  await txDone(tx);
  e.photoIds.forEach(forgetPhoto);
  S.entries = S.entries.filter(x => x.id !== id);
}

/* ==========================================================================
   12. 사진 크게 보기 (넘기기, 확대)
   ========================================================================== */
function openViewer(items, start = 0, { showEntry = false } = {}) {
  if (!items.length) return;
  let i = Math.max(0, Math.min(start, items.length - 1));
  const wrap = document.createElement('div');
  wrap.className = 'ov viewer';
  wrap.innerHTML = `<div class="vw-stage"><img class="vw-img" alt="" draggable="false"></div>
    <div class="vw-bar"><span class="vw-count"></span>
      ${showEntry ? '<button type="button" class="btn small vw-entry">기록 보기</button>' : ''}
      <button type="button" class="icon-btn vw-save" aria-label="사진 저장">${ic('download')}</button>
      <button type="button" class="icon-btn vw-close" aria-label="닫기">${ic('x')}</button></div>
    <button type="button" class="vw-nav vw-prev" aria-label="이전 사진">${ic('left')}</button>
    <button type="button" class="vw-nav vw-next" aria-label="다음 사진">${ic('right')}</button>
    <div class="vw-cap"></div>`;
  document.body.appendChild(wrap);
  const onKey = ev => {
    if (ev.key === 'ArrowLeft') show(i - 1);
    else if (ev.key === 'ArrowRight') show(i + 1);
  };
  document.addEventListener('keydown', onKey);
  const ov = pushOverlay(wrap, { onClose: () => document.removeEventListener('keydown', onKey) });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  const img = $('.vw-img', wrap);
  const stage = $('.vw-stage', wrap);
  let scale = 1, tx = 0, ty = 0;
  const apply = (anim = true) => {
    img.classList.toggle('dragging', !anim);
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  };
  const reset = () => { scale = 1; tx = 0; ty = 0; apply(); };
  const clampPan = () => {
    const mx = Math.max(0, (img.offsetWidth * scale - stage.clientWidth) / 2);
    const my = Math.max(0, (img.offsetHeight * scale - stage.clientHeight) / 2);
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  };

  async function show(n) {
    if (n < 0 || n >= items.length) { reset(); return; }
    i = n;
    reset();
    const it = items[i];
    $('.vw-count', wrap).textContent = `${i + 1} / ${items.length}`;
    $('.vw-prev', wrap).hidden = i === 0;
    $('.vw-next', wrap).hidden = i === items.length - 1;
    const e = it.entryId ? S.entries.find(x => x.id === it.entryId) : null;
    $('.vw-cap', wrap).textContent = it.caption || (e ? `${fmtLong(e.date)}${e.title ? ' · ' + e.title : ''}` : '');
    img.removeAttribute('src');
    if (it.url) { img.src = it.url; return; }
    const th = await photoURL(it.pid, false);
    if (items[i] === it && !img.getAttribute('src') && th) img.src = th;
    const full = await photoURL(it.pid, true);
    if (items[i] === it && full) img.src = full;
    [i - 1, i + 1].forEach(k => { if (items[k]) photoURL(items[k].pid, true); });
  }
  show(i);

  $('.vw-prev', wrap).addEventListener('click', () => show(i - 1));
  $('.vw-next', wrap).addEventListener('click', () => show(i + 1));
  $('.vw-close', wrap).addEventListener('click', () => ov.close());
  $('.vw-save', wrap).addEventListener('click', async () => {
    const it = items[i];
    if (it.blob) { downloadBlob(it.blob, it.name || 'photo.jpg'); toast('사진을 저장했어요'); return; }
    if (!it.pid) return;
    const p = await dbGet('photos', it.pid);
    if (!p) return;
    const e = S.entries.find(x => x.id === items[i].entryId);
    downloadBlob(p.blob, `나경이일기-${e ? e.date : 'photo'}-${i + 1}.jpg`);
    toast('사진을 저장했어요');
  });
  const entryBtn = $('.vw-entry', wrap);
  if (entryBtn) entryBtn.addEventListener('click', async () => {
    const eid = items[i].entryId;
    await ov.close();
    openEntryView(eid);
  });

  // 손가락 동작: 좌우 밀기, 두 번 톡 확대, 두 손가락 확대, 확대 상태에서 끌기
  const pts = new Map();
  let startPt = null, pinch = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  stage.addEventListener('pointerdown', ev => {
    try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* 무시 */ }
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 1) startPt = { x: ev.clientX, y: ev.clientY, tx, ty, t: Date.now() };
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: dist(a, b) || 1, scale };
      startPt = null;
    }
  });
  stage.addEventListener('pointermove', ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      scale = Math.max(1, Math.min(5, pinch.scale * dist(a, b) / pinch.d));
      apply(false);
    } else if (pts.size === 1 && startPt) {
      const dx = ev.clientX - startPt.x, dy = ev.clientY - startPt.y;
      const zf = (window.__vp && window.__vp.zoom) || 1;   // 화면 맞춤으로 줄였으면 손가락 이동을 같은 거리로 맞춤
      if (scale > 1) { tx = startPt.tx + dx / zf; ty = startPt.ty + dy / zf; apply(false); }
      else { img.classList.add('dragging'); img.style.transform = `translateX(${dx / zf}px)`; }
    }
  });
  const end = ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pts.size === 1) {
      const [p] = [...pts.values()];
      startPt = { x: p.x, y: p.y, tx, ty, t: 0 };
      pinch = null;
      return;
    }
    if (pts.size > 0) return;
    pinch = null;
    if (scale <= 1.02) { scale = 1; tx = 0; ty = 0; }
    if (!startPt) { clampPan(); apply(); return; }
    const dx = ev.clientX - startPt.x, dy = ev.clientY - startPt.y;
    const isTap = Math.abs(dx) < 10 && Math.abs(dy) < 10 && startPt.t && Date.now() - startPt.t < 300;
    if (isTap) {
      const now = Date.now();
      if (now - lastTap < 320) {
        lastTap = 0;
        if (scale > 1) reset();
        else {
          const r = stage.getBoundingClientRect();
          scale = 2.5;
          const zf = (window.__vp && window.__vp.zoom) || 1;
          tx = (r.left + r.width / 2 - ev.clientX) * (scale - 1) / zf;
          ty = (r.top + r.height / 2 - ev.clientY) * (scale - 1) / zf;
          clampPan(); apply();
        }
      } else { lastTap = now; apply(); }
    } else if (scale === 1) {
      if (Math.abs(dx) > 60 && Math.abs(dy) < 90) show(dx < 0 ? i + 1 : i - 1);
      else reset();
    } else { clampPan(); apply(); }
    startPt = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
}

const SHIFT_COLORS = [['sun', '노랑'], ['orange', '주황'], ['rose', '분홍'], ['violet', '보라'], ['navy', '남색'], ['teal', '청록'], ['green', '초록'], ['gray', '회색']];

function shiftTypes() {
  const list = S.settings.shiftTypes;
  return Array.isArray(list) && list.length ? list : C.DEFAULT_SHIFT_TYPES;
}
function shiftType(code) { return shiftTypes().find(x => x.code === code) || null; }
function shiftChip(code, long = false) {
  const t = shiftType(code);
  return `<span class="s-chip sc-${t ? t.color : 'gray'}"><b>${esc(code)}</b>${long && t ? ` ${esc(t.name)}` : ''}</span>`;
}
function shiftStatsHTML(map, y, m) {
  const st = C.monthShiftStats(map, y, m);
  const order = shiftTypes().map(t => t.code);
  const codes = [...order.filter(c => st[c]), ...Object.keys(st).filter(c => !order.includes(c))];
  return codes.map(c => `<span class="stat">${shiftChip(c)}${st[c]}</span>`).join('');
}
async function saveShifts(map) {

}

// 홈 화면 근무 카드
function shiftCardHTML() {
  if (S.settings.shiftOn === false) return '';
  const name = herName();

  }
  const offFrom = tt && tt.off ? C.addDays(t, 1) : t;
  const off = C.nextOff(S.shifts, shiftTypes(), offFrom);
  const offText = off
    ? `다음 쉬는 날: <b>${fmtMD(off.date)} (${C.WEEK[C.weekday(off.date)]})</b> · ${C.diffDays(t, off.date) === 1 ? '내일' : `${C.diffDays(t, off.date)}일 뒤`}`

    <p class="stats">${offText}</p></section>`;
}

// 근무표 입력 화면
function openShiftEditor(date) {
  const base = C.isValid(date) ? date : C.today();
  let { y, m } = C.parse(base);
  let cur = base;
  const today = C.today();
  const work = { ...S.shifts };
  const hist = [];
  const imported = new Set();
  const urls = [];
  let dirty = false;
  let photoBlob = null;

  const sh = openSheet({
    title: '근무표', wide: true,
    body: `<div class="se">
      <div class="se-imp">
        <button type="button" class="btn primary block se-import">🤖 사진 속 근무표 자동으로 읽기</button>
        <p class="se-sub">근무표 사진을 Claude가 읽어서 한 달을 한 번에 넣어 줘요</p>
      </div>
      <div class="se-main">
        <div class="se-head">
          <button type="button" class="icon-btn" data-se="prev" aria-label="이전 달">${ic('left')}</button>
          <b class="se-title"></b>
          <button type="button" class="icon-btn" data-se="next" aria-label="다음 달">${ic('right')}</button>
        </div>
        <div class="se-stats"></div>
        <div class="cal-week">${C.WEEK.map(w => `<span>${w}</span>`).join('')}</div>
        <div class="se-grid"></div>
        <div class="se-dock">
          <p class="se-hint" aria-live="polite"></p>
          <div class="se-pad">${shiftTypes().map(t => `<button type="button" class="se-key sc-${t.color}" data-code="${esc(t.code)}"><b>${esc(t.code)}</b><small>${esc(t.name)}</small></button>`).join('')}</div>
          <div class="se-tools"><button type="button" class="btn small" data-se="clear">✕ 이 날 지우기</button>
            <button type="button" class="btn small" data-se="undo">↶ 되돌리기</button></div>
        </div>
      </div>
      <div class="se-photo"></div>
      <input type="file" class="se-file" accept="image/*" hidden>
    </div>`,
    footer: `<button type="button" class="btn ghost" data-x>취소</button><button type="button" class="btn primary se-save">저장</button>`,
    guard: async () => !dirty || confirmBox({ title: '저장하지 않고 닫을까요?', message: '입력한 근무가 사라져요.', ok: '닫기', danger: true }),
    onClose: () => urls.forEach(u => URL.revokeObjectURL(u)),
  });
  const root = $('.se', sh.body);

  function drawGrid() {
    $('.se-title', root).textContent = `${y}년 ${m}월`;
    $('.se-stats', root).innerHTML = shiftStatsHTML(work, y, m) || '<span class="muted">이 달 근무가 아직 없어요</span>';
    const first = C.toStr(y, m, 1);
    const startW = C.weekday(first);
    const dim = C.daysInMonth(y, m);
    let html = '';
    for (let i = 0; i < startW; i++) html += '<span class="se-blank"></span>';
    for (let d = 1; d <= dim; d++) {
      const ds = C.toStr(y, m, d);
      const code = work[ds];
      const w = (startW + d - 1) % 7;
      const t = code ? shiftType(code) : null;
      const cls = ['se-cell'];
      if (ds === cur) cls.push('cur');
      if (w === 0) cls.push('sun');
      if (w === 6) cls.push('sat');
      if (ds === today) cls.push('today');
      if (imported.has(ds)) cls.push('imp');
      html += `<button type="button" class="${cls.join(' ')}" data-date="${ds}" aria-label="${m}월 ${d}일 ${code ? (t ? t.name : code) : '비어 있음'}">
        <span class="se-num">${d}</span>${code ? shiftChip(code) : '<span class="se-empty"></span>'}</button>`;
    }
    $('.se-grid', root).innerHTML = html;
    const cp = C.parse(cur);
    $('.se-hint', root).innerHTML = cp.y === y && cp.m === m
      ? `<b>${cp.m}월 ${cp.d}일</b> 근무를 누르세요<span class="se-hint-more"> · 누르면 다음 날로 넘어가요</span>`
      : '날짜를 누른 뒤 아래 근무 버튼을 누르세요';
  }
  function goMonth(ny, nm) {
    if (ny === y && nm === m) return;
    y = ny; m = nm;
    const cp = C.parse(cur);
    if (cp.y !== y || cp.m !== m) cur = C.toStr(y, m, 1);
    loadPhoto();
  }
  function setDay(code) {
    hist.push({ batch: [{ d: cur, prev: work[cur] || null }], cur });
    if (code) work[cur] = code; else delete work[cur];
    imported.delete(cur);
    dirty = true;
    cur = C.addDays(cur, 1);
    const p = C.parse(cur);
    if (p.y !== y || p.m !== m) { y = p.y; m = p.m; loadPhoto(); }
    drawGrid();
  }
  function undo() {
    const h = hist.pop();
    if (!h) { toast('되돌릴 것이 없어요'); return; }
    for (const { d, prev } of h.batch) { if (prev) work[d] = prev; else delete work[d]; imported.delete(d); }
    cur = h.cur;
    const p = C.parse(cur);
    goMonth(p.y, p.m);
    drawGrid();
  }
  async function loadPhoto() {
    const key = `shiftPhoto:${y}-${pad(m)}`;
    const box = $('.se-photo', root);
    let blob = null;
    try { blob = await kvGet(key, null); } catch (e) { blob = null; }
    if (key !== `shiftPhoto:${y}-${pad(m)}`) return;   // 그 사이 달이 바뀜
    photoBlob = blob;
    if (blob) {
      const url = URL.createObjectURL(blob);
      urls.push(url);
      box.innerHTML = `<p class="se-ph-title">📷 ${m}월 근무표 원본 사진</p>
        <button type="button" class="se-ph-img" data-se="photo-view" aria-label="근무표 사진 크게 보기"><img src="${url}" alt="${m}월 근무표 사진"></button>
        <div class="btn-row"><button type="button" class="btn small" data-se="photo-pick">사진 바꾸기</button>
        <button type="button" class="btn small ghost danger-text" data-se="photo-del">지우기</button></div>`;
    } else {
      box.innerHTML = `<button type="button" class="se-ph-add" data-se="photo-pick">${ic('image')}
        <span><b>${m}월 근무표 사진 보관하기</b><small>원본을 보면서 직접 넣거나, 나중에 다시 확인할 수 있어요</small></span></button>`;
    }
  }

  root.addEventListener('click', async e => {
    const cell = e.target.closest('.se-cell');
    if (cell) { cur = cell.dataset.date; drawGrid(); return; }
    const key = e.target.closest('.se-key[data-code]');
    if (key) { setDay(key.dataset.code || null); return; }
    const b = e.target.closest('[data-se]');
    if (!b) {
      if (e.target.closest('.se-import')) {
        openShiftImport({ y, m, photo: photoBlob, onApply: applyImport });
      }
      return;
    }
    const act = b.dataset.se;
    if (act === 'prev' || act === 'next') {
      let ny = y, nm = m + (act === 'next' ? 1 : -1);
      if (nm < 1) { nm = 12; ny--; }
      if (nm > 12) { nm = 1; ny++; }
      goMonth(ny, nm);
      drawGrid();
    } else if (act === 'undo') undo();
    else if (act === 'clear') setDay(null);
    else if (act === 'photo-pick') $('.se-file', root).click();
    else if (act === 'photo-view' && photoBlob) {
      openViewer([{ url: urls[urls.length - 1], blob: photoBlob, caption: `${y}년 ${m}월 근무표`, name: `근무표-${y}-${pad(m)}.jpg` }]);
    } else if (act === 'photo-del') {
      if (!(await confirmBox({ title: '근무표 사진을 지울까요?', message: '입력한 근무는 그대로 남아요.', ok: '지우기', danger: true }))) return;
      try { await dbDel('kv', `shiftPhoto:${y}-${pad(m)}`); } catch (err) { saveError(err); return; }
      loadPhoto();
      toast('사진을 지웠어요');
    }
  });
  $('.se-file', root).addEventListener('change', async ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const key = `shiftPhoto:${y}-${pad(m)}`;
    try {
      showBusy('사진 정리 중…');
      const img = await decodeImage(f);
      const r = await drawResized(img, img.naturalWidth || img.width, img.naturalHeight || img.height, 2600, 0.88);
      if (img.close) img.close();
      await kvSet(key, r.blob);
      hideBusy();
      await loadPhoto();
      toast('근무표 사진을 보관했어요');
    } catch (err) {
      hideBusy();
      console.warn(err);
      alertBox('사진을 열 수 없어요', 'JPG나 PNG 사진으로 다시 시도해 주세요.');
    }
  });
  function applyImport(r) {
    const batch = [];
    for (const [d, code] of Object.entries(r.map)) {
      batch.push({ d, prev: work[d] || null });
      if (code) work[d] = code; else delete work[d];
      imported.add(d);
    }
    if (!batch.length) return;
    hist.push({ batch, cur });
    dirty = true;
    const firstD = Object.keys(r.map).sort()[0];
    const p = C.parse(firstD);
    goMonth(p.y, p.m);
    cur = firstD;
    drawGrid();
  }
  $('.se-save', sh.el).addEventListener('click', async () => {
    try {
      await saveShifts(work);
      dirty = false;
      await sh.close();
      if (S.view === 'calendar') { const p = C.parse(cur); S.calY = p.y; S.calM = p.m; S.selDate = cur; }
      refreshAll();
      toast('근무표를 저장했어요');
    } catch (err) { saveError(err); }
  });

  drawGrid();
  loadPhoto();
}

// 사진 속 근무표를 Claude로 읽기
function openShiftImport({ y, m, photo, onApply }) {
  const prompt = shiftPrompt(y, m);
  let shareOK = false;
  if (photo) {
    try { shareOK = !!(navigator.canShare && navigator.canShare({ files: [new File([photo], 'a.jpg', { type: 'image/jpeg' })] })); } catch (e) { shareOK = false; }
  }
  const sh = openSheet({
    title: '사진 속 근무표 자동으로 읽기',
    body: `<ol class="steps">
      <li><b>근무표 사진을 준비해요</b>
        <small>${esc(herName())} 이름이 있는 줄과 날짜 줄이 잘 보이면 돼요. 그 부분만 잘라서 보내면 더 정확해요.</small></li>
      <li><b>Claude에게 사진과 부탁 문장을 보내요</b>
        <div class="btn-col">
          ${shareOK ? `<button type="button" class="btn primary" data-im="share">${ic('share')} 보관한 ${m}월 사진 + 문장 보내기</button>` : ''}
          <div class="btn-row">
            <button type="button" class="btn ${shareOK ? '' : 'primary'}" data-im="copy">${ic('copy')} 부탁 문장 복사</button>
            <a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기 ↗</a>
          </div>
        </div>
        <small>Claude에서 ＋ 버튼으로 근무표 사진을 첨부하고, 입력칸을 길게 눌러 문장을 붙여넣은 뒤 보내세요.</small>
        <details class="im-prompt"><summary>부탁 문장 보기</summary><pre>${esc(prompt)}</pre></details></li>
      <li><b>Claude 답을 복사해서 여기에 붙여넣어요</b>
        <small>Claude 답의 복사 버튼을 누른 뒤 이 앱으로 돌아오세요. D·E·N·O를 직접 적어도 돼요 (예: DDENNOO).</small>
        <textarea class="im-text" rows="6" placeholder="근무표 ${y}-${pad(m)}&#10;1 D&#10;2 E&#10;…"></textarea>
        <button type="button" class="btn small" data-im="paste">${ic('copy')} 붙여넣기</button></li>
    </ol>
    <p class="im-msg" aria-live="polite"></p>`,
    footer: `<button type="button" class="btn ghost" data-x>취소</button><button type="button" class="btn primary im-apply">근무표에 넣기</button>`,
  });
  const msg = $('.im-msg', sh.body);
  const ta = $('.im-text', sh.body);
  sh.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-im]');
    if (!b) return;
    const act = b.dataset.im;
    if (act === 'copy') copyText(prompt);
    else if (act === 'paste') {
      try {
        const txt = await navigator.clipboard.readText();
        if (txt) { ta.value = txt; msg.textContent = ''; } else toast('복사된 글이 없어요');
      } catch (err) { toast('입력칸을 길게 눌러 붙여넣기 해 주세요'); ta.focus(); }
    } else if (act === 'share') {
      await copyText(prompt);
      try {
        await navigator.share({ files: [new File([photo], `근무표-${y}-${pad(m)}.jpg`, { type: 'image/jpeg' })], text: prompt });
      } catch (err) {
        if (!err || err.name !== 'AbortError') toast('보내지 못했어요. 문장 복사 후 Claude를 열어 주세요');
      }
    }
  });
  $('.im-apply', sh.el).addEventListener('click', async () => {
    const text = ta.value;
    const r = C.parseShiftText(text, shiftTypes(), { year: y, month: m });
    const n = Object.keys(r.map).length;
    if (!n) {
      msg.textContent = text.trim() ? '읽을 수 있는 근무가 없어요. Claude 답을 그대로 붙여넣었는지 확인해 주세요.' : 'Claude 답을 먼저 붙여넣어 주세요.';
      return;
    }
    await sh.close();
    onApply(r);
    toast(`${n}일 근무를 넣었어요. 사진과 비교해 보고 저장을 눌러 주세요`, 4500);
    if (r.unknown || r.bad.length) {
      const lines = [];
      if (r.unknown) lines.push(`알아볼 수 없다고 한 칸(?): ${r.unknown}개`);
      if (r.bad.length) lines.push(`읽지 못한 줄: ${r.bad.length}개\n${r.bad.slice(0, 5).map(s => `· ${s.trim()}`).join('\n')}${r.bad.length > 5 ? '\n…' : ''}`);
      alertBox('일부는 읽지 못했어요', `${lines.join('\n')}\n\n빈칸은 사진을 보고 직접 넣어 주세요.`);
    }
  });
}

// 근무 종류 추가·고치기
function openShiftTypeEditor(code) {
  const types = shiftTypes();
  const t = code ? types.find(x => x.code === code) : null;
  if (code && !t) return;
  openFormSheet({
    title: t ? '근무 종류 고치기' : '근무 종류 추가',
    fields: [
      { k: 'code', label: '기호', ph: '예) D, M, 휴', max: 3 },
      { k: 'name', label: '이름', ph: '예) 데이, 미들, 휴가', max: 10 },
      { k: 'start', label: '시작 시간', type: 'time', opt: true },
      { k: 'end', label: '끝나는 시간', type: 'time', opt: true },
      { k: 'color', label: '색', type: 'swatch', options: SHIFT_COLORS },
      { k: 'off', label: '쉬는 날', type: 'switch', hint: '켜면 "다음 쉬는 날"을 셀 때 이 근무를 쉬는 날로 쳐요' },
    ],
    values: t || { color: 'teal', off: false },
    onSave: async v => {
      const c = String(v.code || '').replace(/\s/g, '');
      if (!c) { toast('기호를 입력해 주세요'); return false; }
      if (!v.name) { toast('이름을 입력해 주세요'); return false; }
      if (types.some(x => x !== t && String(x.code).toUpperCase() === c.toUpperCase())) { toast('이미 있는 기호예요'); return false; }
      const item = { code: c, name: v.name, start: v.start || '', end: v.end || '', color: v.color || 'gray', off: !!v.off };
      const list = t ? types.map(x => (x === t ? item : x)) : [...types, item];
      if (t && t.code !== c) {
        const moved = {};
        for (const [d, x] of Object.entries(S.shifts)) moved[d] = x === t.code ? c : x;
        await saveShifts(moved);
      }
      await saveSettings({ shiftTypes: list });
      toast('저장했어요');
    },
    onDelete: t ? async () => {
      if (types.length <= 1) throw new Error('근무 종류는 하나 이상 있어야 해요');
      await saveSettings({ shiftTypes: types.filter(x => x !== t) });
    } : null,
  });
}

/* ==========================================================================
   13. 기념일 화면
   ========================================================================== */
function renderEvents() {
  const el = $('#v-events');
  const t = C.today();
  const st = S.settings;
  const all = C.upcoming(eventCtx(), t, 366);
  const f = S.evFilter;
  const list = f === 'all' ? all : all.filter(e => (f === 'birthday' ? (e.kind === 'birthday' || e.kind === 'family') : e.kind === f));
  const filters = [['all', '전체'], ['us', '우리'], ['birthday', '생일'], ['couple', '커플 데이'], ['custom', '직접 만든']];
  // 직접 만든 기념일: 가까운 순서 (지나간 '한 번만' 기념일은 맨 아래)
  const sortKey = v => {
    if (v.repeat === 'once') { const dd = C.diffDays(t, v.date); return dd >= 0 ? dd : 100000 - dd; }
    const n = C.nextYearly(v.date, t);
    return n ? n.dday : 99999;
  };
  const custom = [...S.events].sort((a, b) => sortKey(a) - sortKey(b));
  const hasStart = C.isValid(st.startDate);
  el.innerHTML = `<div class="ev-layout">
    <div class="col">
      <section class="card"><div class="card-head"><h3>다가오는 기념일 <small>1년 안</small></h3></div>
        <div class="chips">${filters.map(([k, l]) => `<button class="chip${f === k ? ' on' : ''}" data-act="ev-filter" data-f="${k}">${l}</button>`).join('')}</div>
        ${list.length ? `<ul class="up-list">${list.map(e => upItem(e, true)).join('')}</ul>` : '<p class="empty">해당하는 기념일이 없어요</p>'}
      </section>
    </div>
    <div class="col">
      <section class="card"><div class="card-head"><h3>우리 ○일은 언제?</h3></div>
        ${hasStart ? `<div class="calc-row"><input type="number" id="calc-n" inputmode="numeric" min="1" max="99999" placeholder="예) 500" aria-label="며칠째"><span>일째</span></div>
          <p class="calc-out" id="calc-out"></p>`
          : `<div class="hint-card">설정에서 사귄 날을 입력하면 100일·주년이 자동으로 계산돼요.<br><button class="link" data-act="go" data-view="settings">사귄 날 입력하기 →</button></div>`}
      </section>
      <section class="card"><div class="card-head"><h3>직접 만든 기념일</h3><button class="btn small soft" data-act="new-event">${ic('plus')}추가</button></div>
        ${custom.length ? custom.map(v => `<button class="list-row" data-act="edit-event" data-id="${esc(v.id)}">
          <span class="up-emoji k-custom">${v.emoji || '⭐'}</span>
          <span class="lr-main"><b>${esc(v.title)}</b><small>${fmtDot(v.date)} · ${v.repeat === 'once' ? '한 번만' : '매년 반복'}${v.memo ? `\n${esc(v.memo)}` : ''}</small></span>
          ${ic('right')}</button>`).join('')
          : '<p class="empty">첫 데이트, 첫 여행, 음력 생일처럼<br>우리만의 날을 추가해 보세요.</p>'}
      </section>
      <section class="card"><div class="card-head"><h3>달력에 표시할 것</h3></div>
        ${switchRow('showMilestones', '100일 · 주년', '사귄 날부터 자동 계산')}
        ${switchRow('showCoupleDays', '주요 커플 데이', '발렌타인 · 화이트 · 빼빼로 · 크리스마스')}
        ${switchRow('show14Days', '매달 14일 데이', '로즈데이 · 키스데이 · 허그데이 등')}
      </section>
    </div></div>`;
}
function updateCalc() {
  const inp = $('#calc-n'), out = $('#calc-out');
  if (!inp || !out) return;
  const n = Math.floor(Number(inp.value));
  const st = S.settings;
  if (!n || n < 1 || n > 99999 || !C.isValid(st.startDate)) { out.innerHTML = ''; return; }
  const d = C.dateOfDay(st.startDate, n, st.countFirstDay !== false);
  const dd = C.diffDays(C.today(), d);
  out.innerHTML = `${n.toLocaleString('ko-KR')}일째는 ${esc(fmtLong(d))}
    <small>${dd === 0 ? '바로 오늘이에요! 🎉' : dd > 0 ? `${dd.toLocaleString('ko-KR')}일 남았어요 (${C.ddayLabel(dd)})` : `${(-dd).toLocaleString('ko-KR')}일 전에 지났어요`}</small>`;
}
function switchRow(key, title, hint) {
  return `<label class="set-row"><span class="lbl"><b>${esc(title)}</b>${hint ? `<small>${esc(hint)}</small>` : ''}</span>

// 좋아하는 것 · 싫어하는 것: 종류별로 모아서 보여 주기
function itemGroupsHTML(listKey) {
  const conf = ITEM_LISTS[listKey];
  const items = S.profile[listKey] || [];
  const known = new Set(conf.cats.map(c => c.k));
  const groups = conf.cats.map(c => ({ ...c, items: items.filter(x => x.cat === c.k || (c.k === conf.cats[conf.cats.length - 1].k && !known.has(x.cat))) }));
  let html = groups.filter(g => g.items.length).map(g => `<div class="ig">
      <div class="ig-head"><span class="ig-e">${g.e}</span><b>${esc(g.k)}</b><small>${g.items.length}</small>
        <button class="ig-add" data-act="add-item" data-list="${listKey}" data-cat="${esc(g.k)}" aria-label="${esc(g.k)} 더 등록">${ic('plus')}</button></div>
      <div class="tags">${g.items.map(x => `<button class="tag item${conf.tag}" data-act="edit-item" data-list="${listKey}" data-id="${esc(x.id)}">${esc(x.text)}${x.memo ? `<small>${esc(x.memo)}</small>` : ''}</button>`).join('')}</div>
    </div>`).join('');
  const unused = groups.filter(g => !g.items.length);
  if (unused.length) {
    html += `<div class="ig-more">${items.length ? '<span class="ig-more-t">다른 종류 등록</span>' : ''}${unused.map(g =>
      `<button class="chip-add" data-act="add-item" data-list="${listKey}" data-cat="${esc(g.k)}">${g.e} ${esc(g.k)} <b>＋</b></button>`).join('')}</div>`;
  }
  return html;
}

// 기본 정보·사이즈 한 칸만 입력
function openFieldEditor(k) {

  if (!f) return;
  const had = !!S.profile[k];
  const sh = openFormSheet({

      if (f.type === 'date' && val && !C.isValid(val)) { toast('날짜를 다시 확인해 주세요'); return false; }
      await saveProfile({ [k]: val });
      toast(val ? `${f.label} 저장했어요` : `${f.label} 비웠어요`);
    },

// 좋아하는 것 · 싫어하는 것 하나씩 등록 / 고치기
function openItemEditor(listKey, { id = null, cat = null } = {}) {
  const conf = ITEM_LISTS[listKey];
  if (!conf) return;
  const cats = conf.cats;
  const item = id ? (S.profile[listKey] || []).find(x => x.id === id) : null;
  if (id && !item) return;
  let curCat = item ? (cats.some(c => c.k === item.cat) ? item.cat : cats[cats.length - 1].k)
    : (cats.some(c => c.k === cat) ? cat : (S.lastCat[listKey] || cats[0].k));
  const catOf = k => cats.find(c => c.k === k) || cats[0];
  const sh = openSheet({
    title: item ? `${conf.title} 고치기` : `${conf.title} 등록`,
    body: `<form class="form" novalidate>
      <div class="field"><span>종류</span><div class="cat-pick">${cats.map(c =>
        `<button type="button" class="chip cat${c.k === curCat ? ' on' : ''}" data-cat="${esc(c.k)}">${c.e} ${esc(c.k)}</button>`).join('')}</div></div>
      <label class="field"><span class="it-label"></span><input type="text" class="it-text" maxlength="60" value="${esc(item ? item.text : '')}" enterkeyhint="${item ? 'done' : 'send'}" autocomplete="off"></label>
      <label class="field"><span>메모 <small>(선택)</small></span><input type="text" class="it-memo" maxlength="100" value="${esc(item ? item.memo || '' : '')}" placeholder="예) 로제 맛, 덜 달게, 2월에 말함" enterkeyhint="${item ? 'done' : 'send'}" autocomplete="off"></label>
      ${item ? '' : '<p class="it-hint">등록해도 이 창은 그대로 있어서 이어서 계속 등록할 수 있어요. 다 했으면 닫기를 누르세요.</p>'}
      <div class="it-have" aria-live="polite"></div>
      ${item ? `<button type="button" class="btn ghost danger-text it-del">${ic('trash')} 삭제하기</button>` : ''}
    </form>`,
    footer: `<button type="button" class="btn ghost" data-x>${item ? '취소' : '닫기'}</button>
      <button type="button" class="btn primary it-save">${item ? '저장' : `${ic('plus')} 등록`}</button>`,
    guard: async () => {
      const typed = $('.it-text', sh.el).value.trim();
      const changed = item ? (typed !== item.text || $('.it-memo', sh.el).value.trim() !== (item.memo || '') || curCat !== item.cat) : !!typed;
      return !changed || confirmBox({ title: '저장하지 않고 닫을까요?', message: item ? '고친 내용이 사라져요.' : `"${typed}"은(는) 아직 등록되지 않았어요.`, ok: '닫기', danger: true });
    },
  });
  const root = sh.el;
  const text = $('.it-text', root);
  const memo = $('.it-memo', root);
  function drawCat() {
    const c = catOf(curCat);
    $$('.chip.cat', root).forEach(b => b.classList.toggle('on', b.dataset.cat === curCat));
    $('.it-label', root).textContent = `${c.e} ${c.k}`;
    text.placeholder = c.ph || '';
    const have = (S.profile[listKey] || []).filter(x => x.cat === curCat && (!item || x.id !== item.id));
    $('.it-have', root).innerHTML = have.length
      ? `<p class="it-have-t">이미 등록된 ${esc(c.k)} ${have.length}개</p><div class="tags">${have.map(x => `<span class="tag${conf.tag}">${esc(x.text)}</span>`).join('')}</div>`
      : '';
  }
  drawCat();
  $('.cat-pick', root).addEventListener('click', e => {
    const b = e.target.closest('.chip.cat');
    if (!b) return;
    curCat = b.dataset.cat;
    drawCat();
    text.focus();
  });
  async function save() {
    const t = text.value.trim();
    const m = memo.value.trim();
    if (!t) { toast('무엇인지 입력해 주세요'); text.focus(); return; }
    const list = S.profile[listKey] || [];
    if (list.some(x => x.cat === curCat && x.text === t && (!item || x.id !== item.id))) { toast('이미 등록돼 있어요'); text.select(); return; }
    try {
      if (item) {
        await saveProfile({ [listKey]: list.map(x => (x.id === item.id ? { ...x, cat: curCat, text: t, memo: m } : x)) });
        text.value = t; memo.value = m; item.text = t; item.memo = m; item.cat = curCat;
        await sh.close();
        refreshAll();
        toast('고쳤어요');
      } else {
        await saveProfile({ [listKey]: [...list, { id: uid(), cat: curCat, text: t, memo: m }] });
        S.lastCat[listKey] = curCat;
        text.value = '';
        memo.value = '';
        drawCat();
        refreshAll();
        toast(`"${t}" 등록했어요`);
        text.focus();
      }
    } catch (err) { saveError(err); }
  }
  $('.it-save', root).addEventListener('click', save);
  $('form', root).addEventListener('submit', e => e.preventDefault());
  [text, memo].forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); save(); }
  }));
  const del = $('.it-del', root);
  if (del) del.addEventListener('click', async () => {
    if (!(await confirmBox({ title: `"${item.text}"을(를) 지울까요?`, ok: '지우기', danger: true }))) return;
    try {
      await saveProfile({ [listKey]: (S.profile[listKey] || []).filter(x => x.id !== item.id) });
      text.value = item.text; memo.value = item.memo || ''; curCat = item.cat;   // 닫을 때 확인창이 뜨지 않게
      await sh.close();
      refreshAll();
      toast('지웠어요');
    } catch (err) { saveError(err); }
  });
  setTimeout(() => { if (document.body.contains(text)) text.focus(); }, 320);
}

// 프로필 사진: 있으면 바꾸기/지우기 고르기
async function openAvatarMenu() {
  if (!S.avatarURL) { $('#file-avatar').click(); return; }
  const sh = openSheet({
    title: '프로필 사진',
    body: `<div class="btn-col"><button type="button" class="btn primary big" data-av="change">${ic('camera')} 사진 바꾸기</button>
      <button type="button" class="btn ghost danger-text" data-av="remove">${ic('trash')} 사진 지우기</button></div>`,
  });
  sh.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-av]');
    if (!b) return;
    if (b.dataset.av === 'change') { await sh.close(); $('#file-avatar').click(); return; }
    if (!(await confirmBox({ title: '프로필 사진을 지울까요?', ok: '지우기', danger: true }))) return;
    try { await dbDel('kv', 'avatar'); } catch (err) { saveError(err); return; }
    setAvatarURL(null);
    await sh.close();
    refreshAll();
    toast('사진을 지웠어요');
  });
}

async function fillStorageInfo() {
  const u = $('#st-usage'), p = $('#st-persist');
  try {
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    if (u) u.textContent = est ? `${fmtBytes(est.usage)}${est.quota ? ` / 최대 ${fmtBytes(est.quota)}` : ''}` : '알 수 없음';
  } catch (e) { if (u) u.textContent = '알 수 없음'; }
  try {
    const on = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
    if (p) p.textContent = on ? '켜짐 ✅' : '꺼짐 (앱으로 설치하면 켜지기 쉬워요)';
  } catch (e) { if (p) p.textContent = '알 수 없음'; }
}
async function requestPersist() {
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* 무시 */ }
}
function applyTheme() {
  const th = S.settings.theme;
  const root = document.documentElement;
  if (th === 'light' || th === 'dark') root.dataset.theme = th; else delete root.dataset.theme;
  const dark = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  let meta = $('meta[name="theme-color"]');
  if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
  meta.content = dark ? '#141015' : '#FBF6F3';
}

const Lock = {
  buf: '',
  get shown() { return $('#lock').classList.contains('show'); },
  show() {
    const el = $('#lock');
    this.buf = '';
    this.drawDots();
    $('.lock-msg', el).textContent = '';
    $('.lock-main', el).hidden = false;
    $('.lock-forgot', el).hidden = true;
    el.classList.add('show');
    if (document.activeElement) document.activeElement.blur();
  },
  hide() { $('#lock').classList.remove('show'); },
  drawDots() { $$('#lock .pin-dots i').forEach((d, i) => d.classList.toggle('on', i < this.buf.length)); },
  press(k) {
    if (k === 'del') this.buf = this.buf.slice(0, -1);
    else if (this.buf.length < 4) this.buf += k;
    this.drawDots();
    if (this.buf.length === 4) setTimeout(() => this.check(), 120);
  },
  check() {
    const st = S.settings;
    if (C.sha256Hex(`${st.pinSalt}:${this.buf}`) === st.pinHash) { this.hide(); this.buf = ''; return; }
    this.buf = '';
    const dots = $('#lock .pin-dots');
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    this.drawDots();
    $('#lock .lock-msg').textContent = `비밀번호가 달라요${st.pinHint ? ` · 힌트: ${st.pinHint}` : ''}`;
  },
  async forgot(date) {
    if (date && date === S.settings.startDate) {
      await saveSettings({ pinHash: '', pinSalt: '', pinHint: '' });
      this.hide();
      render();
      alertBox('잠금을 풀었어요', '비밀번호를 지웠어요. 설정 → 잠금에서 새로 만들 수 있어요.');
    } else {
      $('#lock .lock-msg').textContent = '사귄 날짜가 맞지 않아요';
    }
  },
};
function initLock() {
  const el = $('#lock');
  el.innerHTML = `<div class="lock-logo">${ic('heartFill')}</div>
    <div class="lock-main" style="display:grid;justify-items:center;gap:18px">
      <h2>비밀번호를 입력하세요</h2><p class="lock-msg" aria-live="polite"></p>

      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k =>

  el.addEventListener('click', e => {

  });
  $('.lock-forgot', el).addEventListener('submit', e => {

  });
  document.addEventListener('keydown', e => {
    if (!Lock.shown || !$('.lock-forgot', el).hidden) return;
    if (/^\d$/.test(e.key)) Lock.press(e.key);
    else if (e.key === 'Backspace') Lock.press('del');
  });

const BACKUP_README = `${APP_NAME} — 백업 파일

이 파일은 「${APP_NAME}」 앱의 백업이에요.
앱의 설정 → 백업 파일 불러오기에서 이 ZIP 파일을 그대로 선택하면 기록과 사진이 돌아와요.

- data.json : 기록 글, 그녀 정보, 기념일, 설정
- photos/   : 기록에 넣은 사진 (원본 크기 축소본)
- thumbs/   : 작은 미리보기 사진
- avatar.jpg: 프로필 사진
- shiftphotos/ : 근무표 원본 사진

※ 압축을 풀었다가 다시 압축하지 말고, 받은 ZIP 파일 그대로 보관해 주세요.
`;
function stamp() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
async function buildBackup() {
  showBusy('백업 파일을 만드는 중…', 0);
  const photos = await dbAll('photos');
  const avatar = await kvGet('avatar', null);
  const shiftPhotos = (await dbAll('kv')).filter(r => typeof r.key === 'string' && r.key.startsWith('shiftPhoto:') && r.value);
  const { pinHash, pinSalt, pinHint, ...settings } = S.settings;
  const data = {
    app: 'our-days', format: 1,   // 내부 이름: 바꾸면 예전 백업을 못 읽으니 그대로 둠
    appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    settings, profile: S.profile, entries: S.entries, events: S.events,
    shifts: S.shifts, shiftPhotos: shiftPhotos.map(r => r.key.slice('shiftPhoto:'.length)),
    photos: photos.map(p => ({ id: p.id, entryId: p.entryId, width: p.width, height: p.height, createdAt: p.createdAt, file: `photos/${p.id}.jpg`, thumb: p.thumb ? `thumbs/${p.id}.jpg` : null })),
    avatar: avatar ? 'avatar.jpg' : null,
  };
  const files = [{ name: 'data.json', data: JSON.stringify(data, null, 1) }, { name: '읽어주세요.txt', data: BACKUP_README }];
  for (const p of photos) {
    files.push({ name: `photos/${p.id}.jpg`, data: p.blob });
    if (p.thumb) files.push({ name: `thumbs/${p.id}.jpg`, data: p.thumb });
  }
  if (avatar) files.push({ name: 'avatar.jpg', data: avatar });
  for (const r of shiftPhotos) files.push({ name: `shiftphotos/${r.key.slice('shiftPhoto:'.length)}.jpg`, data: r.value });
  const blob = await C.makeZip(files, (n, total) => showBusy('백업 파일을 만드는 중…', n / total));
  return { blob, name: `나경이일기-백업-${stamp()}.zip` };
}
async function doBackup(mode = 'save') {
  let built;
  try { built = await buildBackup(); }
  catch (err) { hideBusy(); console.error(err); alertBox('백업 파일을 만들지 못했어요', String(err.message || err)); return; }
  hideBusy();
  if (mode === 'share') {
    try {
      const file = new File([built.blob], built.name, { type: 'application/zip' });
      await navigator.share({ files: [file], title: `${APP_NAME} 백업` });
    } catch (err) {
      if (err && err.name === 'AbortError') { toast('공유를 취소했어요'); return; }
      downloadBlob(built.blob, built.name);
    }
  } else {
    downloadBlob(built.blob, built.name);
  }
  await saveSettings({ lastBackupAt: Date.now() });
  refreshAll();
  toast(`백업 파일을 만들었어요 (${fmtBytes(built.blob.size)})`, 3500);
}

function cleanShifts(obj) {
  const out = {};
  if (obj && typeof obj === 'object') {
    for (const [d, c] of Object.entries(obj)) if (C.isValid(d) && typeof c === 'string' && c && c.length <= 4) out[d] = c;
  }
  return out;
}
function mergeProfile(cur, bk) {
  const out = { ...defaultProfile(), ...cur };
  if (!bk || typeof bk !== 'object') return out;
  for (const k of Object.keys(defaultProfile())) {
    const a = out[k], b = bk[k];
    if (Array.isArray(a)) {
      if (!Array.isArray(b) || !b.length) continue;
      if (typeof b[0] === 'object') {
        const ids = new Set(a.map(x => x && x.id));
        out[k] = [...a, ...b.filter(x => x && !ids.has(x.id))];
      } else out[k] = [...new Set([...a, ...b])];
    } else if (!a && b) out[k] = b;
  }
  return out;
}
function chooseRestoreMode(data, hasData) {
  return new Promise(resolve => {
    let choice = null;
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ko-KR') : '';
    const sh = openSheet({
      title: '백업 파일 불러오기',
      body: `<p class="desc strong">${esc(when)} 에 만든 백업</p>
        <ul class="sum"><li>기록 ${(data.entries || []).length}개</li><li>사진 ${(data.photos || []).length}장</li><li>직접 만든 기념일 ${(data.events || []).length}개</li>
        ${data.shifts && Object.keys(data.shifts).length ? `<li>근무표 ${Object.keys(data.shifts).length}일</li>` : ''}</ul>
        ${hasData ? `<div class="choice">
          <button type="button" class="choice-btn" data-c="merge"><b>➕ 합치기</b><small>지금 기록은 그대로 두고 백업 내용을 더해요. 같은 기록은 더 최근에 고친 쪽이 남아요.</small></button>
          <button type="button" class="choice-btn" data-c="replace"><b>🔄 바꾸기</b><small>지금 기기의 기록을 모두 지우고 백업 내용으로 바꿔요.</small></button></div>`
          : `<button type="button" class="btn primary block big" data-c="replace" style="margin-top:16px">불러오기</button>`}`,
      onClose: () => resolve(choice),
    });
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-c]');
      if (!b) return;
      if (b.dataset.c === 'replace' && hasData) {
        const ok = await confirmBox({ title: '지금 기록을 모두 바꿀까요?', message: '이 기기의 기록과 사진이 지워지고 백업 내용으로 바뀌어요.', ok: '바꾸기', danger: true });
        if (!ok) return;
      }
      choice = b.dataset.c;
      await sh.close();
    });
  });
}
async function cleanOrphanPhotos() {
  const entries = await dbAll('entries');
  const ref = new Set(entries.flatMap(e => (Array.isArray(e.photoIds) ? e.photoIds : [])));
  const keys = await reqP(store('photos').getAllKeys());
  const del = keys.filter(k => !ref.has(k));
  if (!del.length) return;
  const tx = db.transaction('photos', 'readwrite');
  del.forEach(k => tx.objectStore('photos').delete(k));
  await txDone(tx);
}
async function restoreFromFile(file) {
  let zip, data, prefix = '';
  try {
    zip = await C.readZip(file);
    const dn = zip.names.find(n => n === 'data.json')
      || zip.names.find(n => n.endsWith('/data.json') && !n.startsWith('__MACOSX'));
    if (!dn) throw new Error('data.json 없음');
    prefix = dn.slice(0, dn.length - 'data.json'.length);
    data = JSON.parse(await zip.text(dn));
    if (!data || data.app !== 'our-days') throw new Error('다른 앱의 파일');
  } catch (err) {
    console.warn(err);
    alertBox('불러올 수 없는 파일이에요', `「${APP_NAME}」에서 만든 백업 파일(나경이일기-백업-….zip, 예전 이름 our-days-backup-….zip)을 압축을 풀지 않은 그대로 골라 주세요.`);
    return;
  }
  const hasData = S.entries.length > 0 || S.events.length > 0 || !!S.profile.name;
  const mode = await chooseRestoreMode(data, hasData);
  if (!mode) return;

  showBusy('백업을 불러오는 중…', 0);
  try {
    const entries = (Array.isArray(data.entries) ? data.entries : []).filter(e => e && e.id && C.isValid(e.date)).map(normEntry);
    const events = (Array.isArray(data.events) ? data.events : []).filter(v => v && v.id && C.isValid(v.date));
    const photos = (Array.isArray(data.photos) ? data.photos : []).filter(p => p && p.id);
    const bShifts = cleanShifts(data.shifts);
    const bShiftPhotos = Array.isArray(data.shiftPhotos) ? data.shiftPhotos.filter(x => /^\d{4}-\d{2}$/.test(String(x))) : [];
    let have = new Set();
    if (mode === 'replace') {
      const kvKeys = await reqP(store('kv').getAllKeys());
      const tx = db.transaction(['entries', 'photos', 'events', 'kv'], 'readwrite');
      ['entries', 'photos', 'events'].forEach(s => tx.objectStore(s).clear());
      tx.objectStore('kv').delete('avatar');
      kvKeys.filter(k => typeof k === 'string' && k.startsWith('shiftPhoto:')).forEach(k => tx.objectStore('kv').delete(k));
      await txDone(tx);
      clearPhotoCache();
    } else {
      have = new Set(await reqP(store('photos').getAllKeys()));
    }
    const curE = new Map(mode === 'merge' ? S.entries.map(e => [e.id, e]) : []);
    const curV = new Map(mode === 'merge' ? S.events.map(v => [v.id, v]) : []);
    {
      const tx = db.transaction(['entries', 'events'], 'readwrite');
      for (const e of entries) {
        const c = curE.get(e.id);
        if (!c || e.updatedAt > c.updatedAt) tx.objectStore('entries').put(e);
      }
      for (const v of events) {
        const c = curV.get(v.id);
        if (!c || (v.updatedAt || v.createdAt || 0) > (c.updatedAt || c.createdAt || 0)) tx.objectStore('events').put(v);
      }
      await txDone(tx);
    }
    const todo = photos.filter(p => !have.has(p.id));
    for (let i = 0; i < todo.length; i += 20) {
      const batch = [];
      for (const p of todo.slice(i, i + 20)) {
        const blob = await zip.blob(prefix + (p.file || `photos/${p.id}.jpg`), 'image/jpeg');
        if (!blob) continue;
        const thumb = (p.thumb && await zip.blob(prefix + p.thumb, 'image/jpeg')) || blob;
        batch.push({ id: p.id, entryId: p.entryId, blob, thumb, width: p.width || 0, height: p.height || 0, createdAt: p.createdAt || Date.now() });
      }
      if (batch.length) {
        const tx = db.transaction('photos', 'readwrite');
        batch.forEach(b => tx.objectStore('photos').put(b));
        await txDone(tx);
      }
      showBusy('사진을 불러오는 중…', Math.min(1, (i + 20) / todo.length));
    }
    const bs = data.settings && typeof data.settings === 'object' ? data.settings : {};
    if (mode === 'replace') {
      const keep = { pinHash: S.settings.pinHash, pinSalt: S.settings.pinSalt, pinHint: S.settings.pinHint, lastBackupAt: S.settings.lastBackupAt };
      delete bs.pinHash; delete bs.pinSalt; delete bs.pinHint;
      if (!Array.isArray(bs.shiftTypes) || !bs.shiftTypes.length) delete bs.shiftTypes;
      await kvSet('settings', { ...defaultSettings(), ...bs, ...keep, onboarded: true });
      await kvSet('profile', { ...defaultProfile(), ...(data.profile || {}) });
      await kvSet('shifts', bShifts);
    } else {
      const ns = { ...S.settings };
      for (const k of ['startDate', 'myName', 'myBirthday']) if (!ns[k] && bs[k]) ns[k] = bs[k];
      if (Array.isArray(bs.shiftTypes)) {
        const haveCodes = new Set(shiftTypes().map(t => t.code));
        ns.shiftTypes = [...shiftTypes(), ...bs.shiftTypes.filter(t => t && t.code && !haveCodes.has(t.code))];
      }
      ns.onboarded = true;
      await kvSet('settings', ns);
      await kvSet('profile', mergeProfile(S.profile, data.profile));
      await kvSet('shifts', { ...bShifts, ...S.shifts });   // 같은 날은 지금 기기 쪽이 남음
      await cleanOrphanPhotos();
    }
    for (const ym of bShiftPhotos) {
      if (mode === 'merge' && await kvGet(`shiftPhoto:${ym}`, null)) continue;
      const b = await zip.blob(`${prefix}shiftphotos/${ym}.jpg`, 'image/jpeg');
      if (b) await kvSet(`shiftPhoto:${ym}`, b);
    }
    if (data.avatar && (mode === 'replace' || !(await kvGet('avatar', null)))) {
      const av = await zip.blob(prefix + data.avatar, 'image/jpeg');
      if (av) await kvSet('avatar', av);
    }
    clearPhotoCache();
    await loadAll();
    applyTheme();
    const ob = $('#onboard');
    if (ob) ob.remove();
    hideBusy();
    refreshAll();
    toast(`불러왔어요 · 기록 ${S.entries.length}개, 사진 ${photoTotal()}장`, 3500);
  } catch (err) {
    hideBusy();
    console.error(err);
    await loadAll().catch(() => {});
    refreshAll();
    alertBox('불러오는 중 문제가 생겼어요', `${err && err.message ? err.message : err}\n\n백업 파일은 그대로 있으니 다시 시도해 주세요.`);
  }
}

  });
  // 달력 좌우로 밀어 달 바꾸기
  const cal = $('#v-calendar');
  let sw = null;
  cal.addEventListener('touchstart', e => {
    if (!e.target.closest('.cal-grid') || e.touches.length !== 1) { sw = null; return; }
    sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  cal.addEventListener('touchend', e => {
    if (!sw) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - sw.x, dy = p.clientY - sw.y;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50 && Date.now() - sw.t < 700) { S.swiped = Date.now(); moveMonth(dx < 0 ? 1 : -1); }
    sw = null;
  }, { passive: true });
  // 다른 앱에 갔다가 돌아오면: 날짜 바뀜 확인, 1분 넘으면 잠금
  document.addEventListener('visibilitychange', () => {

    if (S.settings.pinHash && S.hiddenAt && Date.now() - S.hiddenAt > 60000) Lock.show();
    checkDayChange();
  });
  setInterval(checkDayChange, 60000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    S.installEvt = e;
    if (S.view === 'home' || S.view === 'settings') render();
  });
  window.addEventListener('appinstalled', () => { S.installEvt = null; toast('앱을 설치했어요 📲'); });
}

  S.calY = now.getFullYear();
  S.calM = now.getMonth() + 1;
  history.replaceState({ base: true }, '');
  setView('home');
  if (!S.settings.onboarded) showOnboarding();
  else if (S.settings.pinHash) Lock.show();
  registerSW();
  if (S.entries.length) requestPersist();
  window.__ourDays = { version: APP_VERSION, S, C };
}
boot();
})();

</script>
